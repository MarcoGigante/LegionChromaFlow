name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/LegionChromaFlow.csproj -c Release -o bin
      - name: Self-test (no keyboard required)
        run: dotnet bin/LegionChromaFlow.dll selftest
