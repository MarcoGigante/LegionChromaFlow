name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/LegionChromaFlow.csproj -c Release -o bin
      - name: Self-test
        run: dotnet bin/LegionChromaFlow.dll selftest
      - name: Package
        shell: pwsh
        run: |
          $name = "LegionChromaFlow-${{ github.ref_name }}"
          New-Item -ItemType Directory $name, "$name/logs" | Out-Null
          Copy-Item bin, config, src, docs -Destination $name -Recurse
          Copy-Item *.bat, *.vbs, README*.md, LICENSE -Destination $name
          Remove-Item "$name/bin/*.pdb" -ErrorAction SilentlyContinue
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LegionChromaFlow-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
